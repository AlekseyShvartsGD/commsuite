# Commsuite TURN-over-TCP relay (coturn).
# Serves only media relay for WebRTC calls. Public reachability is provided by a
# single CloudPub raw-TCP tunnel -> mux.js (:7777) -> this :3478 listener.
# Runs inside WSL2 Ubuntu (installed via: apt-get install coturn).

listening-port=3478
# Advertise/bind the LAN address so clients on the same network can reach the
# relayed ports. Without this coturn picks up the machine's public IP, which
# behind carrier-grade NAT is unreachable from inside the LAN.
# Must match the host LAN IP (change both lines if the address changes).
relay-ip=192.168.0.146
external-ip=192.168.0.146
relay-threads=1
lt-cred-mech
user=commsuite:commsuite-1
realm=commsuite.local
min-port=49152
max-port=49200
fingerprint
no-tls
no-dtls
no-cli
allow-loopback-peers
verbose
log-file=/tmp/commsuite-turn.log